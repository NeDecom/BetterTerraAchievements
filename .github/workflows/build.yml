name: Build tModLoader Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download tModLoader
        run: |
          cd ..
          mkdir -p ./tmod
          cd ./tmod
          wget https://github.com/tModLoader/tModLoader/releases/latest/download/tModLoader.zip
          unzip -o tModLoader.zip
          cd ../${{ github.event.repository.name }}

      - name: Build mod
        run: |
          dotnet build -c Release -p:tModLoaderPath="$(pwd)/../tmod"

      - name: Find tmod
        run: |
          echo "=== Ищем .tmod ==="
          find /home/runner -name "*.tmod" 2>/dev/null

      - name: Upload .tmod
        uses: actions/upload-artifact@v4
        with:
          name: mod-file
          path: '**/*.tmod'
          if-no-files-found: error
