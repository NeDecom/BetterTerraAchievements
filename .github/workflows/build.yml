name: Build tModLoader Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Download tModLoader (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/tModLoader/tModLoader/releases/download/v2026.06.3.2/tModLoader_Windows.zip" -OutFile "tModLoader.zip"
          Expand-Archive -Path "tModLoader.zip" -DestinationPath "tModLoader" -Force
          
      - name: Build mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\mods_output"
          Remove-Item -Path "C:\Users\runneradmin\Documents\My Games\Terraria\tModLoader\Mods\*.tmod" -Force -ErrorAction SilentlyContinue
          dotnet build -c Release -p:tModLoaderPath="${{ github.workspace }}\tModLoader" -p:ModsPath="${{ github.workspace }}\mods_output"

      - name: Find tmod
        shell: pwsh
        run: |
          Write-Host "=== mods_output ==="
          Get-ChildItem -Path "${{ github.workspace }}\mods_output" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Поиск .tmod по системе ==="
          Get-ChildItem -Path "C:\Users\runneradmin\Documents" -Recurse -Filter "*.tmod" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Copy tmod to workspace
        shell: pwsh
        run: |
          $source = "C:\Users\runneradmin\Documents\My Games\Terraria\tModLoader\Mods\BetterTerraAchievements.tmod"
          $dest = "${{ github.workspace }}\output"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Path $source -Destination $dest -Force
          Write-Host "=== Скопировано: ==="
          Get-ChildItem -Path $dest | Select-Object Name, Length

      - name: Upload .tmod
        uses: actions/upload-artifact@v4
        with:
          name: mod-file
          path: output/BetterTerraAchievements.tmod
          if-no-files-found: error
