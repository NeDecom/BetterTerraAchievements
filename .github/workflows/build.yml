name: Build tModLoader Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Download tModLoader (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/tModLoader/tModLoader/releases/download/v2026.06.3.2/tModLoader.zip" -OutFile "tModLoader.zip"
          Write-Host "=== Размер архива ==="
          Get-Item "tModLoader.zip" | Select-Object Length, FullName
          Expand-Archive -Path "tModLoader.zip" -DestinationPath "tModLoader" -Force
          Write-Host "=== Содержимое папки tModLoader (всё, рекурсивно) ==="
          Get-ChildItem -Path "tModLoader" -Recurse | Select-Object FullName
          Write-Host "=== Ищем tModLoader.targets ==="
          $target = Get-ChildItem -Path "tModLoader" -Recurse -Filter "tModLoader.targets" -ErrorAction SilentlyContinue
          if ($target) {
          Write-Host "НАЙДЕН: $($target.FullName)"
          $sourceDir = $target.DirectoryName
          Write-Host "Копирую из $sourceDir в tModLoader..."
          Copy-Item -Path "$sourceDir\*" -Destination "tModLoader" -Recurse -Force
          } else {
            Write-Host "НЕ НАЙДЕН! Структура архива другая."
          }
          
      - name: Build mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\mods_output"
          dotnet build -c Release -p:tModLoaderPath="${{ github.workspace }}\tModLoader" -p:ModsPath="${{ github.workspace }}\mods_output"

      - name: Upload .tmod
        uses: actions/upload-artifact@v4
        with:
          name: mod-file
          path: |
            **/*.tmod
            ${{ github.workspace }}/mods_output/*.tmod
          if-no-files-found: warn
