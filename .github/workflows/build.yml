name: Build tModLoader Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download tModLoader
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/tModLoader/tModLoader/releases/download/v2026.08.2.1/tModLoader.zip" -OutFile "tModLoader.zip"
          Expand-Archive -Path "tModLoader.zip" -DestinationPath "${{ runner.temp }}\tModLoader" -Force

      - name: Build mod
        shell: pwsh
        run: |
          dotnet build -c Release -p:tModLoaderPath="${{ runner.temp }}\tModLoader"

      - name: Clean tmod
        shell: pwsh
        run: |
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) { $sevenZip = "7z" }

          $tmod = (Get-ChildItem -Path "C:\Users\runneradmin\Documents" -Recurse -Filter "*.tmod" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $tmod) { Write-Host "Не найден .tmod"; exit 1 }
          Write-Host "Чистим: $tmod"
          Write-Host "Размер до очистки: $((Get-Item $tmod).Length) байт"

          $temp = "${{ github.workspace }}\clean"
          if (Test-Path $temp) { Remove-Item -Path $temp -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $temp | Out-Null

          & $sevenZip x $tmod -o"$temp" -y | Out-Null

          Write-Host "=== До очистки: ==="
          Get-ChildItem -Path $temp -Recurse | Select-Object FullName, Length

          $toRemove = @(
            "tModLoader.dll", "tModLoader.pdb", "tModLoader.xml",
            "tModLoader.deps.json", "tModLoader.runtimeconfig.json",
            "tModLoader.runtimeconfig.dev.json", "tMLMod.targets",
            "tModPorter.dll.config", "serverconfig.txt",
            "RecentGitHubCommits.txt",
            "start-tModLoader.bat", "start-tModLoader.sh",
            "start-tModLoader-FamilyShare.bat", "start-tModLoader-FamilyShare.sh",
            "start-tModLoaderServer.bat", "start-tModLoaderServer.sh",
            "Libraries", "tModPorter", "DedicatedServerUtils", "LaunchUtils"
          )
          foreach ($item in $toRemove) {
            $path = Join-Path $temp $item
            if (Test-Path $path) {
              Remove-Item -Path $path -Recurse -Force
              Write-Host "Удалено: $item"
            }
          }

          # Чистим Content, оставляя только Items
          $contentPath = Join-Path $temp "Content"
          if (Test-Path $contentPath) {
            Get-ChildItem -Path $contentPath -Exclude "Items" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "=== Content очищен, оставлена только Items ==="
          }

          Write-Host "=== После очистки: ==="
          Get-ChildItem -Path $temp -Recurse | Select-Object FullName, Length

          Write-Host "=== Корень .tmod: ==="
          Get-ChildItem -Path $temp | Select-Object Name, Length

          $newTmod = "${{ github.workspace }}\output\BetterTerraAchievements.tmod"
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\output" | Out-Null
          Push-Location $temp
          & $sevenZip a -tzip $newTmod "*" | Out-Null
          Pop-Location

          Write-Host "=== Новый размер: $((Get-Item $newTmod).Length) байт ==="

      - name: Upload .tmod
        uses: actions/upload-artifact@v4
        with:
          name: mod-file
          path: output/BetterTerraAchievements.tmod
          if-no-files-found: error
